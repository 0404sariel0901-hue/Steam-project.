<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧自動滴灌系統 - 完整精細版</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #0b0e14; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #ffffff;
            background: rgba(15, 20, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #26a69a;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 350px;
        }
        #ui-overlay h2 { margin: 0 0 10px 0; font-size: 20px; color: #26a69a; }
        #ui-overlay p { margin: 5px 0; font-size: 13px; opacity: 0.9; line-height: 1.4; }
        .label-hint { color: #4fc3f7; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h2>智慧自動滴灌系統 3D 模型</h2>
        <p>● <span class="label-hint">盆栽系統：</span> 包含加厚花盆、底盤、深色培植土，以及多層次仿生植物綠葉。</p>
        <p>● <span class="label-hint">環形滴水裝置：</span> 獨立圓環結構，帶有 8 個下垂噴頭，模擬重力加速度落水效果。</p>
        <p>● <span class="label-hint">手稿文字標註：</span> 水管上方標有 "To Water Pump" 與接頭處的 "Water In" 字樣。</p>
        <p>● <span class="label-hint">互動操作：</span> 滑鼠左鍵拖曳旋轉視角，滾輪可做無限細節放大檢視。</p>
    </div>

    <script>
        // --- 1. 初始化場景、相機與高端抗鋸齒渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e14);
        scene.fog = new THREE.FogExp2(0x0b0e14, 0.015);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(22, 16, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // 滑鼠視角控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minDistance = 2;
        controls.maxDistance = 50;

        // --- 2. 燈光系統 ---
        const ambientLight = new THREE.AmbientLight(0xdff0ff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(15, 35, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 側邊補光
        const fillLight = new THREE.DirectionalLight(0x80d8ff, 0.4);
        fillLight.position.set(-15, 10, -15);
        scene.add(fillLight);

        // 地面網格
        const grid = new THREE.GridHelper(60, 60, 0x26a69a, 0x1c2028);
        grid.position.y = -0.01;
        scene.add(grid);

        const systemGroup = new THREE.Group();
        scene.add(systemGroup);

        // ==========================================
        // A. 儲水箱與水泵系統
        // ==========================================
        const tankGroup = new THREE.Group();
        tankGroup.position.set(-8, 4, 0);

        // 玻璃外框
        const glassMat = new THREE.MeshStandardMaterial({ color: 0xe0f7fa, transparent: true, opacity: 0.15, roughness: 0.05, metalness: 0.5, side: THREE.DoubleSide });
        const tank = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), glassMat);
        tankGroup.add(tank);

        // 水體
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x0091ea, transparent: true, opacity: 0.4, roughness: 0.1 });
        const water = new THREE.Mesh(new THREE.BoxGeometry(7.9, 5, 7.9), waterMat);
        water.position.y = -1.45;
        tankGroup.add(water);

        // 抽水馬達
        const pump = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2, 3), new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.4 }));
        pump.position.set(0, -3, 0);
        pump.castShadow = true;
        tankGroup.add(pump);
        systemGroup.add(tankGroup);

        // ==========================================
        // B. 完整植栽系統 (Potted Plant)
        // ==========================================
        const plantSystem = new THREE.Group();
        plantSystem.position.set(6, 0, 0);

        // 花盆
        const potMat = new THREE.MeshStandardMaterial({ color: 0xca6924, roughness: 0.8, side: THREE.DoubleSide });
        const potBody = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 3.2, 6, 32, 1, true), potMat);
        potBody.position.y = 3;
        potBody.castShadow = true;
        plantSystem.add(potBody);

        // 底托盤
        const saucer = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.3, 0.6, 32), potMat);
        saucer.position.y = 0.3;
        plantSystem.add(saucer);

        // 土壤
        const soil = new THREE.Mesh(new THREE.CylinderGeometry(4.0, 3.8, 5.6, 32), new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 1.0 }));
        soil.position.y = 2.9;
        soil.receiveShadow = true;
        plantSystem.add(soil);

        // 植物植物主體
        const plantGroup = new THREE.Group();
        plantGroup.position.y = 5.8;

        // 莖部
        const stemGeo = new THREE.CylinderGeometry(0.12, 0.25, 5, 12);
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.6, side: THREE.DoubleSide });
        const mainStem = new THREE.Mesh(stemGeo, leafMat);
        mainStem.position.y = 2.3;
        mainStem.castShadow = true;
        plantGroup.add(mainStem);

        // 多層次綠葉
        for(let i=0; i<10; i++) {
            const leafGeo = new THREE.SphereGeometry(1.3, 16, 16);
            leafGeo.scale(1, 0.1, 2.2);
            const leaf = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.5, side: THREE.DoubleSide }));
            leaf.position.y = 0.8 + i * 0.45;
            leaf.rotation.y = (i * Math.PI / 3.2);
            leaf.rotation.x = 0.35;
            leaf.castShadow = true;
            plantGroup.add(leaf);
        }
        plantSystem.add(plantGroup);
        systemGroup.add(plantSystem);

        // ==========================================
        // C. 獨立圓形滴水裝置 (Circular Drip Ring)
        // ==========================================
        const dripRingGroup = new THREE.Group();
        dripRingGroup.position.set(6, 8.2, 0); 

        const ringMat = new THREE.MeshStandardMaterial({ color: 0x0288d1, metalness: 0.6, roughness: 0.2 });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.14, 16, 100).rotateX(Math.PI/2), ringMat);
        ring.castShadow = true;
        dripRingGroup.add(ring);

        // 固定金屬支架
        for (let i = 0; i < 3; i++) {
            const ang = (i / 3) * Math.PI * 2;
            const bracket = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.5, 8), new THREE.MeshStandardMaterial({ color: 0x78909c, metalness: 0.7 }));
            bracket.position.set(Math.cos(ang) * 2.5, -1.25, Math.sin(ang) * 2.5);
            bracket.castShadow = true;
            dripRingGroup.add(bracket);
        }

        // 噴頭與動態水滴初始化
        const droplets = [];
        const emitterCount = 8;
        const dropGeo = new THREE.SphereGeometry(0.06, 12, 12).scale(1, 1.8, 1);
        const dropMat = new THREE.MeshStandardMaterial({ color: 0x29b6f6, transparent: true, opacity: 0.85, roughness: 0.0 });

        const startY = -0.3; 
        const endY = -2.3; // 對應撞擊土表的位置

        for (let i = 0; i < emitterCount; i++) {
            const angle = (i / emitterCount) * Math.PI * 2;
            const x = Math.cos(angle) * 2.5;
            const z = Math.sin(angle) * 2.5;

            // 實體滴水嘴
            const nozzle = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 12).rotateX(Math.PI), ringMat);
            nozzle.position.set(x, -0.1, z);
            dripRingGroup.add(nozzle);

            // 動態水滴
            const drop = new THREE.Mesh(dropGeo, dropMat);
            drop.position.set(x, startY, z);
            dripRingGroup.add(drop);

            droplets.push({ mesh: drop, time: Math.random() * 2, startX: x, startZ: z, speed: 0.45 + Math.random() * 0.15 });
        }
        systemGroup.add(dripRingGroup);

        // 連接水管
        const pipePath = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-8, 1, 0),
            new THREE.Vector3(-8, 9.5, 0),
            new THREE.Vector3(0, 10.8, -1),
            new THREE.Vector3(4.2, 9.5, 0),
            new THREE.Vector3(4.9, 8.4, 0)
        ]);
        const pipe = new THREE.Mesh(new THREE.TubeGeometry(pipePath, 64, 0.13, 16, false), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.65, roughness: 0.1 }));
        pipe.castShadow = true;
        systemGroup.add(pipe);

        // ==========================================
        // D. 智慧控制器與實體 3D 向量文字標籤
        // ==========================================
        const ctrlGroup = new THREE.Group();
        ctrlGroup.position.set(0, 10, -3);
        ctrlGroup.add(new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 2), new THREE.MeshStandardMaterial({ color: 0x263238 })));
        systemGroup.add(ctrlGroup);

        // 3D 向量標籤生成函數
        function create3DLabel(text, position, color = 0x4fc3f7, scale = 1.0) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.font = 'Bold 42px Arial';
            ctx.fillStyle = '#' + new THREE.Color(color).getHexString();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.position.copy(position);
            sprite.scale.set(scale * 4, scale, 1);
            return sprite;
        }

        // 依手稿加入標籤
        systemGroup.add(create3DLabel("→ to water pump", new THREE.Vector3(-3.5, 11.2, 0), 0x4fc3f7, 1.2));
        systemGroup.add(create3DLabel("water in →", new THREE.Vector3(3.0, 9.4, 0), 0x4fc3f7, 1.2));
        systemGroup.add(create3DLabel("Water Reservoir", new THREE.Vector3(-8, 8.8, 0), 0xffffff, 0.9));
        systemGroup.add(create3DLabel("Circular Drip Device", new THREE.Vector3(6, 9.5, 0), 0x26a69a, 1.1));
        systemGroup.add(create3DLabel("Potted Plant", new THREE.Vector3(10, 5, 0), 0xffffff, 0.8));

        // --- 4. 物理動力學與動畫循環 ---
        const clock = new THREE.Clock();
        const g = 9.8; // 重力加速度
        const rippleGeo = new THREE.RingGeometry(0.01, 0.08, 32).rotateX(-Math.PI / 2);
        const rippleMat = new THREE.MeshBasicMaterial({ color: 0x4fc3f7, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
        const ripples = [];

        function createRippleEffect(x, z) {
            const rip = new THREE.Mesh(rippleGeo, rippleMat.clone());
            rip.position.set(6 + x, 5.82, z); // 精確貼在土表
            scene.add(rip);
            ripples.push({ mesh: rip, scale: 1, maxScale: 4 + Math.random()*2, opacity: 0.8 });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            controls.update();

            // 1. 水滴重力自由落體運動
            droplets.forEach(d => {
                d.time += delta * d.speed;
                let currentY = startY - (0.5 * g * d.time * d.time);
                
                // 觸碰到土壤
                if (currentY <= endY) {
                    createRippleEffect(d.startX, d.startZ); // 觸發漣漪
                    d.time = 0; // 重置
                    currentY = startY;
                }
                d.mesh.position.y = currentY;

                // 微觀凝聚變形細節
                if (d.time < 0.12) {
                    const progress = d.time / 0.12;
                    d.mesh.scale.set(progress, progress, progress);
                } else {
                    d.mesh.scale.set(1, 1.8, 1);
                }
            });

            // 2. 漣漪擴散漸隱動畫
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.scale += delta * 11;
                r.mesh.scale.set(r.scale, r.scale, 1);
                r.opacity -= delta * 1.6;
                r.mesh.material.opacity = r.opacity;

                if (r.opacity <= 0 || r.scale >= r.maxScale) {
                    scene.remove(r.mesh);
                    r.mesh.geometry.dispose();
                    r.mesh.material.dispose();
                    ripples.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // 視窗尺寸監聽
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);
    </script>
</body>
</html>
